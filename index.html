<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LocalQ — 지도로 묻고 현지인이 답하는 여행 Q&amp;A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2563EB;--blue-ink:#1D4ED8;--blue-soft:#EAF1FE;--teal:#14B8A6;--teal-ink:#0F766E;--teal-soft:#E6F7F5;
  --amber:#F59E0B;--amber-ink:#92400E;--amber-soft:#FEF3C7;--red:#DC2626;
  --bg:#FFFFFF;--surface:#F8FAFC;--surface-2:#F1F5F9;--text:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --card:#FFFFFF;--shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.10);--shadow-sm:0 1px 2px rgba(15,23,42,.08),0 2px 8px rgba(15,23,42,.06);
  --land:#EEF2F5;--water:#BFDCF5;--park:#D7ECDF;--mount:#CBE3D3;--road:#FFFFFF;--road-c:#D6DEE8;--line2:#22A06B;--label-halo:#EEF2F5;
  --bub-them:#F1F5F9;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#3B82F6;--blue-ink:#93C5FD;--blue-soft:#172554;--teal:#2DD4BF;--teal-ink:#5EEAD4;--teal-soft:#0F2E2B;
  --amber:#FBBF24;--amber-ink:#FDE68A;--amber-soft:#3A2A06;--red:#F87171;
  --bg:#0F172A;--surface:#131D31;--surface-2:#1E293B;--text:#F1F5F9;--muted:#94A3B8;--line:#273449;
  --card:#162036;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);--shadow-sm:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);
  --land:#141E30;--water:#1C3756;--park:#163127;--mount:#142A23;--road:#26334A;--road-c:#1A2438;--line2:#2BB673;--label-halo:#141E30;
  --bub-them:#1E293B;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --blue:#3B82F6;--blue-ink:#93C5FD;--blue-soft:#172554;--teal:#2DD4BF;--teal-ink:#5EEAD4;--teal-soft:#0F2E2B;
  --amber:#FBBF24;--amber-ink:#FDE68A;--amber-soft:#3A2A06;--red:#F87171;
  --bg:#0F172A;--surface:#131D31;--surface-2:#1E293B;--text:#F1F5F9;--muted:#94A3B8;--line:#273449;
  --card:#162036;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);--shadow-sm:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);
  --land:#141E30;--water:#1C3756;--park:#163127;--mount:#142A23;--road:#26334A;--road-c:#1A2438;--line2:#2BB673;--label-halo:#141E30;
  --bub-them:#1E293B;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 "IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
img{max-width:100%;display:block}
.ic{flex:none;display:block}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.fine{font-size:12.5px;color:var(--muted);line-height:1.5;display:flex;gap:6px;align-items:flex-start}
.fine .ic{margin-top:2px}
.center{justify-content:center;text-align:center}
.reward,.amt,.stat b,.wl-main b{font-variant-numeric:tabular-nums}

/* ---------- app shell ---------- */
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-areas:"head" "main" "nav"}
.topbar{grid-area:head;display:flex;align-items:center;gap:8px;padding:8px 12px;height:56px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:6}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;letter-spacing:-.02em;font-size:17px;text-decoration:none;color:var(--text)}
.brand svg{width:28px;height:28px}
.region{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 auto;padding:6px 10px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:14px;max-width:180px}
.region span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.region .ic{color:var(--blue)}
.mode{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;flex:none}
.mode button{padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.mode button[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:var(--shadow-sm)}
.mode button[data-mode="answer"][aria-pressed="true"]{background:var(--teal-ink)}
.lang{position:relative;display:flex;align-items:center;gap:3px;padding:6px 8px;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.lang select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.lang:focus-within{outline:2px solid var(--blue)}
.main{grid-area:main;position:relative;min-height:0;overflow:hidden}
.view{position:absolute;inset:0}
.view-page{overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (max-width:430px){.brand b{display:none}.mode button{padding:5px 8px}}

/* tab bar */
.tabbar{grid-area:nav;display:flex;justify-content:space-around;align-items:flex-end;border-top:1px solid var(--line);background:var(--bg);padding:6px 4px 6px;position:relative;z-index:6}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;border-radius:12px}
.tab.on{color:var(--blue)}
.tab .badge{position:absolute;top:0;left:calc(50% + 6px)}
.tab-create{color:var(--text)}
.fab{width:52px;height:52px;margin-top:-26px;border-radius:18px;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(37,99,235,.35);border:3px solid var(--bg)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;line-height:1}

/* ---------- map ---------- */
.view-map{display:block}
.map-area{position:absolute;inset:0;overflow:hidden}
.map{position:absolute;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;background:var(--land)}
.map.dragging{cursor:grabbing}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.m-land{fill:var(--land)}.m-park{fill:var(--park)}.m-mount{fill:var(--mount)}
.m-water{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round}
.m-road-c{fill:none;stroke:var(--road-c);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.m-road{fill:none;stroke:var(--road);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.m-line2{fill:none;stroke:var(--line2);stroke-width:2;opacity:.5;stroke-dasharray:1 0}
.overlay{position:absolute;inset:0;pointer-events:none}
.overlay>*{position:absolute;left:0;top:0}
.lbl{translate:-50% -50%;white-space:nowrap;font-weight:600;color:var(--muted);text-shadow:0 0 3px var(--label-halo),0 0 3px var(--label-halo),0 0 6px var(--label-halo)}
.lbl-d{font-size:12px;letter-spacing:.02em;opacity:.85}
.lbl-h{font-size:13px;color:var(--text);opacity:.55}
.lbl-p{font-size:11px;opacity:.85}
.pin{pointer-events:auto;translate:-50% -100%;margin-top:-6px;display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;font-weight:700;font-size:13px;line-height:1.2;white-space:nowrap;background:var(--card);color:var(--blue-ink);border:2px solid var(--blue);box-shadow:var(--shadow-sm);transition:scale .15s}
.pin::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:inherit;border-right:inherit;border-bottom:inherit;transform:translateX(-50%) rotate(45deg);border-bottom-right-radius:2px}
.pin .amt{display:flex;align-items:center;gap:3px;position:relative;z-index:1}
.pin-unanswered{background:var(--amber);color:#1F1300;border-color:#fff;box-shadow:0 0 0 4px rgba(245,158,11,.28),var(--shadow-sm);font-size:14px;padding:6px 12px}
.pin-active .cnt{position:absolute;top:-8px;right:-8px;min-width:18px;height:18px;border-radius:999px;background:var(--teal-ink);color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid var(--card);z-index:2;padding:0 3px}
.pin-completed{background:var(--surface-2);color:var(--muted);border-color:var(--line);font-size:11.5px;padding:3px 8px;font-weight:600}
.pin-mine{background:var(--blue);color:#fff;border-color:#fff}
.pin-dim{opacity:.6}
.pin-sel{scale:1.15;z-index:5;opacity:1}
.cluster{pointer-events:auto;translate:-50% -50%;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;padding:6px 10px;border-radius:16px;background:var(--blue);color:#fff;box-shadow:var(--shadow);line-height:1.1;border:2px solid #fff}
.cluster b{font-size:17px}.cluster small{font-size:10.5px;opacity:.9;white-space:nowrap}
.cluster.has-open{box-shadow:0 0 0 4px rgba(245,158,11,.55),var(--shadow)}
.subzone{translate:-50% -50%;border-radius:50%;border:2px dashed var(--teal);background:rgba(20,184,166,.08)}
.subzone.editing{border-style:solid;background:rgba(20,184,166,.14)}
.crosshair{translate:-50% -50%;width:18px;height:18px;border-radius:50%;background:var(--teal-ink);border:3px solid #fff;box-shadow:var(--shadow-sm)}
.me-dot{translate:-50% -50%;width:16px;height:16px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 8px rgba(37,99,235,.18)}
.drop-pin{translate:-50% -100%;color:var(--blue);filter:drop-shadow(0 3px 4px rgba(15,23,42,.3))}
.drop-pin svg{fill:var(--card)}

.map-top{position:absolute;top:12px;left:12px;right:68px;z-index:4;max-width:460px}
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:15px}
.search.inline{box-shadow:none;border:1px solid var(--line);background:var(--surface);margin:14px 0 6px}
.search-results{margin-top:6px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px;max-height:50vh;overflow:auto}
.sr-label{font-size:12px;color:var(--muted);font-weight:600;padding:4px 6px 8px}
.sr{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 8px;border-radius:10px}
.sr:hover,.sr:focus-visible{background:var(--surface-2)}
.sr .ic{color:var(--blue);margin-top:2px}
.sr span{display:flex;flex-direction:column;font-weight:600}
.sr small{font-weight:400;color:var(--muted);font-size:12.5px}
.sr-empty{padding:10px;color:var(--muted);margin:0;font-size:14px}
.map-ctrls{position:absolute;top:12px;right:12px;z-index:4;display:flex;flex-direction:column;gap:8px}
.ctl{position:relative;width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--text)}
.ctl:active{scale:.95}
.ctl-zoomIn{border-radius:14px 14px 0 0;margin-bottom:-8px;box-shadow:var(--shadow-sm)}
.ctl-zoomOut{border-radius:0 0 14px 14px;border-top:1px solid var(--line);box-shadow:var(--shadow-sm)}
.ctl-subscribe{color:var(--teal-ink)}
.ctl .dot{position:absolute;top:5px;right:5px;min-width:16px;height:16px;border-radius:999px;background:var(--blue);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.banner{position:absolute;top:68px;left:12px;right:68px;z-index:4;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:460px}
.banner span{flex:1}.banner .link{color:#fff;text-decoration:underline}
.preview{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;display:flex;justify-content:center;pointer-events:none}
.preview>*{pointer-events:auto}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.pv{position:relative;width:100%;max-width:480px;padding:16px 16px 14px;box-shadow:var(--shadow);border:0}
.pv-x{position:absolute;top:8px;right:8px}
.pv-place{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600;padding-right:30px}
.pv-place .ic{color:var(--blue)}
.cat{padding:2px 8px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted)}
.pv-title{margin:8px 0 4px;font-size:18px;line-height:1.35;font-weight:700;letter-spacing:-.01em}
.pv-desc{margin:0 0 6px;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pv-desc.full{display:block;-webkit-line-clamp:unset;white-space:pre-wrap}
.pv-addr{margin:0;color:var(--muted);font-size:13px}
.pv-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:8px;font-size:13px;color:var(--muted)}
.pv-meta>span{display:inline-flex;align-items:center;gap:4px}
.reward{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:var(--amber-soft);color:var(--amber-ink);font-weight:700;font-size:14px}
.pv-actions{display:flex;gap:8px;margin-top:14px}
.pv-actions .btn{flex:1}
.hint-card{width:100%;max-width:480px;padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);border:0}
.hint-card p{margin:0;flex:1;font-size:14px;color:var(--muted)}
.summary-chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:600;font-size:14px}
.summary-chip .ic{color:var(--amber)}
.tr-note{display:flex;align-items:center;gap:5px;margin:4px 0 0;font-size:12px;color:var(--teal-ink)}
.tr-note.warn{color:var(--amber-ink)}

/* list panel */
.list-panel{display:none;position:absolute;inset:70px 0 0;z-index:3;background:var(--bg);overflow-y:auto;border-top:1px solid var(--line)}
.list-open .list-panel{display:block}
.list-open .preview{display:none}
.lp-head{position:sticky;top:0;background:var(--bg);padding:14px 16px 10px;z-index:1}
.lp-head h2{margin:0 0 10px;font-size:16px}
.lp-list{padding:0 16px 24px;display:flex;flex-direction:column;gap:10px}
.qcard{display:block;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:border-color .15s}
.qcard:hover{border-color:var(--blue)}
.qc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qc-place{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.qc-place .ic{color:var(--blue)}
.dist{margin-left:6px;font-weight:500}
.qc-title{margin:6px 0 8px;font-weight:600;font-size:15.5px;line-height:1.4}
.qc-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--muted)}
.unread{color:var(--blue);font-weight:700}
.st{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.st-unanswered{background:var(--amber-soft);color:var(--amber-ink)}
.st-active{background:var(--teal-soft);color:var(--teal-ink)}
.st-completed,.st-expired,.st-cancelled{background:var(--surface-2);color:var(--muted)}
.st-selected{background:var(--blue-soft);color:var(--blue-ink)}
.demo-chip{padding:1px 7px;border-radius:6px;border:1px dashed var(--muted);color:var(--muted);font-size:11px;font-weight:600}

/* chips, buttons, forms */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:14px;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.amber{background:var(--amber);color:#1F1300}
.btn.danger{background:var(--red);color:#fff}
.btn.small{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.wide{width:100%}
.link{color:var(--blue);font-weight:600;font-size:inherit;text-decoration:none}
.danger-text{color:var(--red)!important}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.field{display:block;margin:16px 0 0}
.fl{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
.fl small{font-weight:500;color:var(--muted);margin-left:4px}
.field input[type=text],.field textarea,.text-in,.won-input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px;outline:0}
.field input:focus,.field textarea:focus,.text-in:focus,.won-input:focus-within{border-color:var(--blue);background:var(--card)}
.field textarea{resize:vertical;min-height:84px;line-height:1.5}
.won-input{display:flex;align-items:center;gap:6px;padding:0 14px}
.won-input span{font-weight:700;color:var(--muted)}
.won-input input{flex:1;border:0;background:transparent;outline:0;padding:12px 0;font-size:15px;min-width:0}
.switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch:checked{background:var(--teal-ink)}
.switch:checked::after{left:21px}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;font-weight:600;font-size:14px}

/* sheets */
.sheet-root{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.sheet{position:relative;width:100%;max-width:520px;max-height:85vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.sheet-root{align-items:center}.sheet{border-radius:22px}}
.sh-title{margin:0 0 6px;font-size:18px}
.sh-body{margin:0;color:var(--muted);font-size:14.5px}
.sh-actions{display:flex;gap:8px;margin-top:20px}
.sh-actions .btn{flex:1}

/* subscription editor */
.sub-sheet{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;display:flex;justify-content:center}
.sub-card{width:100%;max-width:480px;padding:16px;box-shadow:var(--shadow);border:0;max-height:62%;overflow:auto}
.sub-head{display:flex;justify-content:space-between;align-items:center}
.sub-head h2{margin:0;font-size:17px}
.sub-where{display:flex;align-items:center;gap:6px;margin:6px 0 2px;font-weight:700;color:var(--teal-ink)}
.sub-hint{margin:0;font-size:13px;color:var(--muted)}
.sub-card .field{margin-top:12px}
.sub-card .btn.wide{margin-top:14px}
.chips.scroll{flex-wrap:nowrap}

/* pages */
.page{max-width:720px;margin:0 auto;padding:18px 16px 32px}
.page-title{margin:0 0 14px;font-size:24px;letter-spacing:-.02em;line-height:1.25}
.page-head{display:flex;justify-content:space-between;align-items:baseline}
.seg{display:flex;background:var(--surface-2);padding:4px;border-radius:14px;margin-bottom:14px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow-sm)}
.cards{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty p{margin:0;max-width:34ch}
.block{margin-top:26px}
.block h2{font-size:16px;margin:0 0 10px}
.block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.block-head h2{margin:0}
.sub-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px 12px 14px;margin-bottom:8px}
.sr-main{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13px;color:var(--muted)}
.sr-main b{font-size:15px;color:var(--text);width:100%}
.sr-actions{display:flex;align-items:center;gap:2px}
.nlist{display:flex;flex-direction:column}
.nrow{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:12px 6px;border-bottom:1px solid var(--line);width:100%}
.nrow.unread .n-main b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:6px;vertical-align:middle}
.n-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.n-new_question{background:var(--amber-soft);color:var(--amber-ink)}
.n-new_answer,.n-message{background:var(--teal-soft);color:var(--teal-ink)}
.n-selected{background:var(--blue-soft);color:var(--blue-ink)}
.n-main{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13.5px;color:var(--muted)}
.n-main b{color:var(--text);font-size:14.5px;font-weight:600}
.n-main span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-time{font-size:12px;color:var(--muted);flex:none}
.prof{display:flex;gap:16px;align-items:center;padding:18px}
.prof-av{position:relative;cursor:pointer;flex:none}
.av-edit{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.prof-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.prof-name{display:flex;align-items:center;gap:2px;font-size:20px}
.prof-main .muted{font-size:13.5px}
.level{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;margin-top:4px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--teal-soft);color:var(--teal-ink)}
.lang-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-top:10px;font-weight:600;font-size:14px}
.lang-row span{display:flex;align-items:center;gap:8px}
.lang-row select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:19px}.stat b.rw{font-size:15px;color:var(--amber-ink)}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}
.rep{padding:14px}
.rep-bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.rep-bar span{display:block;height:100%;background:var(--teal);border-radius:999px}
.rep p{margin:8px 0 10px;font-size:13.5px;color:var(--muted)}
.rep-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rep-steps li{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);padding-top:8px;border-top:3px solid var(--line)}
.rep-steps li.done{border-color:var(--teal)}
.rep-steps b{font-size:12.5px;color:var(--text)}
.wallet{padding:16px}
.wl-main{display:flex;justify-content:space-between;align-items:baseline}
.wl-main span{font-weight:600;color:var(--muted)}
.wl-main b{font-size:26px;letter-spacing:-.02em}
.wl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.wl-grid div{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;font-size:12.5px;color:var(--muted)}
.wl-grid b{font-size:16px;color:var(--text)}
.wallet .btn{margin-top:10px}
.txlist{display:flex;flex-direction:column}
.txrow{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.txrow>div{display:flex;flex-direction:column;min-width:0;font-size:13px;color:var(--muted)}
.txrow>div b{color:var(--text);font-size:14px}
.txrow>div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txrow small{font-size:12px}
.txs{margin-left:6px;font-weight:600}
.txs-pending{color:var(--amber-ink)}.txs-refunded{color:var(--muted)}
.txrow .amt{font-weight:700;white-space:nowrap}
.amt.pos{color:var(--teal-ink)}.amt.neg{color:var(--text)}
.neg{color:var(--red)}
.personas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0 14px}
.persona{position:relative;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left}
.persona.on{border-color:var(--blue);background:var(--blue-soft)}
.persona span{display:flex;flex-direction:column;line-height:1.25}
.persona small{color:var(--muted);font-size:12px}
.persona .now{position:absolute;top:6px;right:8px;font-size:10.5px;font-weight:700;color:var(--blue-ink)}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none;overflow:hidden;background:var(--surface-2)}
.av img{width:100%;height:100%;object-fit:cover}

/* full-screen flows */
.full-root{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.35);display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.full{width:100%;max-width:640px;height:100%;background:var(--bg);display:flex;flex-direction:column}
@media (min-width:700px){.full{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.full-head{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:56px;border-bottom:1px solid var(--line)}
.full-head h1{margin:0;font-size:17px;flex:1;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-count{font-size:13px;color:var(--muted);font-weight:600;padding-right:6px}
.full-body{flex:1;overflow-y:auto;padding:4px 18px 24px}
.full-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.full-foot .btn{flex:1}
.full-foot .btn.ghost{flex:0 0 auto}
.steps{display:flex;list-style:none;margin:0;padding:12px 18px 4px;gap:6px}

.steps li span{height:4px;border-radius:999px;background:var(--line);font-size:0}
.steps li.on{color:var(--blue)}.steps li.on span{background:var(--blue)}
.steps li.done span{background:var(--blue);opacity:.45}
.cr-h{font-size:20px;margin:18px 0 10px;letter-spacing:-.01em}
.loc-card{display:flex;gap:10px;align-items:flex-start;padding:14px;border-color:var(--blue);background:var(--blue-soft)}
.loc-card .ic{color:var(--blue);margin-top:2px}
.loc-card div{display:flex;flex-direction:column}
.loc-card span{font-size:13px;color:var(--muted)}
.cr-results{display:flex;flex-direction:column}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.loc-mini{display:flex;align-items:center;gap:6px;margin-top:16px;font-weight:600;font-size:14px}
.loc-mini .ic{color:var(--blue)}
.loc-mini .link{margin-left:auto;font-size:13px}
.img-prev{position:relative;display:inline-block}
.img-prev img{max-height:160px;border-radius:12px}
.img-prev .icon-btn{position:absolute;top:6px;right:6px;background:rgba(15,23,42,.6);color:#fff;width:28px;height:28px}
.img-prev.small img{max-height:72px;border-radius:10px}
.file-btn{cursor:pointer}
.reward-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rw-opt{padding:14px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.rw-opt.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber-ink)}
@media (max-width:360px){.reward-grid{grid-template-columns:repeat(2,1fr)}}
.fee{margin-top:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.fee div{display:flex;justify-content:space-between}
.fee span{color:var(--muted)}
.review{padding:16px;margin-bottom:10px}
.rv-img{margin-top:10px;border-radius:12px;max-height:240px;object-fit:cover}

/* room */
.rh-title{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.rh-title div{min-width:0;display:flex;flex-direction:column}
.rh-title span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-body{flex:1;overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px}
.qblock{padding:14px}
.qblock .pv-title{font-size:17px}
.qblock .link{display:block;margin-top:12px;font-size:13.5px}
.by{display:flex;align-items:center;gap:6px;margin:10px 0 0;font-size:13px;color:var(--muted)}
.qmini{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.qmini summary{padding:10px 12px;cursor:pointer;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.qmini .qblock{border:0;box-shadow:none;background:transparent;padding-top:0}
.sbanner{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-weight:600;font-size:14px;color:var(--muted)}
.sbanner.ok{background:var(--amber-soft);color:var(--amber-ink)}
.join{padding:16px;text-align:center}
.join p{margin:0 0 12px;color:var(--muted);font-size:14px}
.join .fine{margin-top:10px;justify-content:center}
.threads{display:flex;flex-direction:column;gap:8px}
.thread{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
.th-main{flex:1;min-width:0;display:flex;flex-direction:column}
.th-main b{font-size:15px;display:flex;align-items:center;gap:6px}
.th-main>span{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--muted)}
.msgs{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.mcol{display:flex;flex-direction:column;gap:3px;min-width:0}
.msg.me .mcol{align-items:flex-end}
.who{font-size:12px;font-weight:600;color:var(--muted);padding:0 4px}
.bub{padding:10px 13px;border-radius:18px;background:var(--bub-them);border-bottom-left-radius:6px;overflow:hidden}
.msg.me .bub{background:var(--blue);color:#fff;border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.bub p{margin:0;white-space:pre-wrap;word-break:break-word}
.bub img{border-radius:12px;margin:-4px -7px 6px;max-width:calc(100% + 14px);max-height:240px;object-fit:cover}
.bub img:last-child{margin-bottom:-4px}
.mmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:11.5px;color:var(--muted);padding:0 4px}
.msg.me .mmeta{justify-content:flex-end}
.read{color:var(--blue-ink);font-weight:600}
.tr-toggle{display:inline-flex;align-items:center;gap:3px;color:var(--teal-ink);font-weight:600;font-size:11.5px}
.tr-toggle.warn{color:var(--amber-ink)}
.composer{border-top:1px solid var(--line);padding:8px 10px 10px;background:var(--bg)}
.composer.off{opacity:.6}
.cmp-row{display:flex;align-items:flex-end;gap:6px}
.cmp-row textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:10px 14px;outline:0;max-height:120px;line-height:1.4;font-size:15px}
.cmp-row textarea:focus{border-color:var(--blue)}
.cmp-row label.icon-btn{width:42px;height:42px}
.send{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4}
.cmp-note{margin:6px 6px 0;font-size:12px;color:var(--teal-ink);display:flex;align-items:center;gap:4px;min-height:0}
.cmp-note:empty{display:none}
#cmpPrev:empty{display:none}
#cmpPrev{padding:4px 6px 8px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));translate:-50% 20px;z-index:90;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:min(92vw,440px);opacity:0;pointer-events:none;transition:opacity .2s,translate .2s;text-align:center}
.toast.show{opacity:1;translate:-50% 0}

/* desktop split */
@media (min-width:960px){
  .app{grid-template-columns:88px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"nav head" "nav main"}
  .tabbar{flex-direction:column;justify-content:flex-start;align-items:stretch;gap:6px;border-top:0;border-right:1px solid var(--line);padding:16px 8px}
  .tab{flex:none;padding:10px 0;font-size:12px}
  .tab.on{background:var(--blue-soft)}
  .tab-create{order:-1;margin-bottom:10px}
  .fab{margin-top:0}
  .topbar{padding:8px 20px}
  .region{max-width:240px;flex:0 1 auto}
  .topbar .mode{margin-left:auto}
  .view-map{display:grid;grid-template-columns:1fr 400px}
  .map-area{position:relative;inset:auto}
  .list-panel{display:block;position:relative;inset:auto;border-top:0;border-left:1px solid var(--line)}
  .ctl-toggleList{display:none}
  .list-open .preview{display:flex}
  .preview{right:auto;width:420px;left:20px;bottom:20px}
  .sub-sheet{right:auto;width:440px;left:20px;bottom:20px}
  .map-top{left:20px;top:20px}
  .map-ctrls{top:20px;right:20px}
  .banner{left:20px;top:76px}
  .toast{bottom:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const Mp = { s: 0.5, tx: 0, ty: 0, W: 0, H: 0, ptrs: new Map(), down: null, raf: 0, MIN: 0.12, MAX: 6 };

  let s = `<rect x="-3000" y="-3000" width="${WORLD.w + 6000}" height="${WORLD.h + 6000}" class="m-land"/>`;
  GEO.mountains.forEach(([lng, lat, rx, ry]) => { s += el(lat, lng, rx, ry, 'm-mount'); });
  GEO.parks.forEach(([lng, lat, rx, ry]) => { s += el(lat, lng, rx, ry, 'm-park'); });
  s += `<path d="${pathFrom(GEO.han)}" class="m-water" stroke-width="95"/>`;
  GEO.streams.forEach(([w, pts]) => { s += `<path d="${pathFrom(pts)}" class="m-water" stroke-width="${w}"/>`; });
  GEO.roads.forEach(pts => { s += `<path d="${pathFrom(pts)}" class="m-road-c" vector-effect="non-scaling-stroke"/>`; });
  GEO.roads.forEach(pts => { s += `<path d="${pathFrom(pts)}" class="m-road" vector-effect="non-scaling-stroke"/>`; });

const toScreen = (lat, lng) => { const w = proj(lat, lng); return { x: w.x * Mp.s + Mp.tx, y: w.y * Mp.s + Mp.ty }; };
const toLL = (x, y) => unproj((x - Mp.tx) / Mp.s, (y - Mp.ty) / Mp.s);

const isWide = () => matchMedia('(min-width: 960px)').matches;

function mapInit() {
  const map = $('#map');

    const r = map.getBoundingClientRect(); if (!r.width) return;
    const c = first ? null : mapCenter(); Mp.W = r.width; Mp.H = r.height;

  if (s < 0.55) DISTRICTS.forEach(d => { const p = pos(d.lat, d.lng); if (p) out.push(`<span class="lbl lbl-d" style="${tr(p)}">${esc(lang() === 'ko' ? d.ko : d.en)}</span>`); });
  if (s >= 0.55 && s < 2.2) HOODS.forEach(h => { const p = pos(h.lat, h.lng); if (p) out.push(`<span class="lbl lbl-h" style="${tr(p)}">${esc(hoodName(h))}</span>`); });
  if (s >= 2.2) PLACES.forEach(pl => { const p = pos(pl.lat, pl.lng); if (p) out.push(`<span class="lbl lbl-p" style="${tr(p)}">${esc(pName(pl))}</span>`); });

function locate(after) {
  if (!navigator.geolocation) { toast(t('loc_denied')); return; }
  toast(t('loc_finding'));
  navigator.geolocation.getCurrentPosition(p => {
    const ll = { lat: p.coords.latitude, lng: p.coords.longitude };
    if (!inSeoul(ll.lat, ll.lng)) { S.myLoc = null; toast(t('loc_outside')); return; }

function crValidate(step) {

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'map';
  closeSheet();
  if (h.startsWith('q-')) {
    const qid = h.slice(2);
    if (!qById(qid)) { location.replace('#map'); return; }
    S.createOpen = false; openRoomState(qid);
  } else {
    S.room = null;
    if (h !== 'map' && h !== 'create') S.pick = null;
    if (h === 'create') { if (!S.draft) S.draft = newDraft(); S.createOpen = true; }
    else { S.createOpen = false; if (['map', 'questions', 'notifications', 'profile'].includes(h)) S.tab = h; }
  }
  rerenderAll();
}

async function onAct(act, el, e) {
  const id = el.dataset.id, v = el.dataset.v;
  switch (act) {
    case 'pin': if (e.detail === 0) openPreview(el.dataset.qid); break;
    case 'closeSheet': closeSheet(false); break;
    case 'confirmOk': closeSheet(true); break;
    case 'setMode': setMode(el.dataset.mode); break;
    case 'regionSearch': if (S.tab !== 'map') location.hash = 'map'; setTimeout(() => $('#searchInput').focus(), 50); break;
    case 'locate': locate(); break;
    case 'zoomIn': zoomAt(Mp.W / 2, Mp.H / 2, 1.6); break;
    case 'zoomOut': zoomAt(Mp.W / 2, Mp.H / 2, 1 / 1.6); break;
    case 'filter': openFilters(); break;
    case 'subscribe': startSubEdit(null); break;
    case 'toggleList': S.listOpen = !S.listOpen; S.preview = null; renderMapChrome(); break;
    case 'closePreview': S.preview = null; renderMapChrome(); scheduleOverlay(); break;
    case 'clearDrop': S.dropPin = null; renderMapChrome(); scheduleOverlay(); break;
    case 'askHere': S.draft = newDraft(); S.draft.loc = S.dropPin; S.draft.step = 2; S.dropPin = null; location.hash = 'create'; break;
    case 'askBlank': S.draft = newDraft(); location.hash = 'create'; break;
    case 'answerNow': try { API.join(id); goRoom(id); setTimeout(() => $('#cmpText') && $('#cmpText').focus(), 80); } catch (err) { toast(t('err_' + err.message)); } break;
    case 'openRoom': case 'cardOpen': goRoom(id); break;
    case 'cluster': if (e.detail === 0) { const [la, ln] = el.dataset.cluster.split(',').map(Number); flyTo(la, ln, Mp.s * 2.4); } break;
    case 'sort': S.sort = v; if (S.tab === 'map') renderList(); else renderPage(); break;
    case 'goHood': { const h = HOODS.find(x => x.k === el.dataset.k); S.searchOpen = false; S.search = ''; $('#searchInput').value = ''; $('#searchInput').blur(); renderSearchResults(); flyTo(h.lat, h.lng, Math.max(Mp.s, 1.2)); break; }
    case 'goPlace': { const p = PLACES.find(x => x.id === id); S.searchOpen = false; S.search = ''; $('#searchInput').value = ''; $('#searchInput').blur(); renderSearchResults(); flyTo(p.lat, p.lng, Math.max(Mp.s, 2)); if (S.mode === 'ask') { S.dropPin = locFromLL(p); S.preview = null; renderMapChrome(); } break; }
    case 'cancelPick': S.pick = null; location.hash = 'create'; break;
    // filters
    case 'fCat': { const c = S.fdraft.cats; const i = c.indexOf(v); i < 0 ? c.push(v) : c.splice(i, 1); renderFilterSheet(); break; }
    case 'fMin': S.fdraft.minReward = +v; renderFilterSheet(); break;
    case 'fDone': S.fdraft.showCompleted = el.checked; break;
    case 'fReset': S.fdraft = { cats: [], showCompleted: true, minReward: 0 }; renderFilterSheet(); break;
    case 'fApply': S.filters = S.fdraft; closeSheet(); renderMapChrome(); scheduleOverlay(); if (S.tab !== 'map') renderPage(); break;
    // subscriptions
    case 'subRadius': S.subEdit.radius = +v; flyTo(mapCenter().lat, mapCenter().lng, subZoom(+v)); renderSubSheet(); break;
    case 'subCat': { const c = S.subEdit.cats; const i = c.indexOf(v); i < 0 ? c.push(v) : c.splice(i, 1); renderSubSheet(); break; }
    case 'subMin': S.subEdit.min = +v; renderSubSheet(); break;
    case 'subCancel': S.subEdit = null; renderMapChrome(); scheduleOverlay(); break;
    case 'subSave': {
      const c = mapCenter(), e2 = S.subEdit, h = nearest(HOODS, c), p = nearest(PLACES, c);
      const nk = p.d < 400 ? p.x.ko : h.x.ko, ne = p.d < 400 ? p.x.en : h.x.en;
      const rec = { user_id: S.uid, name_ko: nk, name_en: ne, latitude: +c.lat.toFixed(5), longitude: +c.lng.toFixed(5), radius_meters: e2.radius, categories: e2.cats, minimum_reward: e2.min, notifications_enabled: true };
      if (e2.id) Object.assign(DB.subscriptions.find(x => x.id === e2.id), rec); else DB.subscriptions.push({ id: newId('s'), ...rec });
      save(); S.subEdit = null; toast(t('sub_saved', { name: lang() === 'ko' ? nk : ne })); renderMapChrome(); scheduleOverlay(); break;
    }
    case 'subNew': startSubEdit(null); break;
    case 'subEditBtn': startSubEdit(DB.subscriptions.find(x => x.id === id)); break;
    case 'subToggle': { const s = DB.subscriptions.find(x => x.id === id); if (s && s.user_id === S.uid) { s.notifications_enabled = el.checked; save(); } break; }
    case 'subDel': { const s = DB.subscriptions.find(x => x.id === id); if (await confirmSheet({ title: t('del_sub_q'), body: esc(lang() === 'ko' ? s.name_ko : s.name_en), ok: t('delete'), danger: true })) { DB.subscriptions = DB.subscriptions.filter(x => x.id !== id); save(); renderPage(); } break; }
    // pages
    case 'qSeg': S.qSeg = v; renderPage(); break;
    case 'readAll': DB.notifications.forEach(n => { if (n.user_id === S.uid) n.is_read = true; }); save(); renderPage(); renderTabbar(); break;
    case 'openNotif': { const n = DB.notifications.find(x => x.id === id); if (n) { n.is_read = true; save(); if (n.question_id && qById(n.question_id)) { if (n.type === 'new_question') { const q = qById(n.question_id); location.hash = 'map'; setTimeout(() => { flyTo(q.latitude, q.longitude, Math.max(Mp.s, 1.4)); openPreview(q.id); }, 60); } else { S.room = null; goRoom(n.question_id, n.params.from); } } else renderPage(); } break; }
    case 'profTab': S.profTab = v; renderPage(); break;
    case 'topUp': API.topUp(10000); toast(t('topped_up', { amt: won(10000) })); renderPage(); break;
    case 'switchUser': S.uid = id; ss.set('lq_uid', id); S.room = null; S.preview = null; S.dropPin = null; S.qSeg = null; toast(t('switched', { name: me().display_name })); rerenderAll(); break;
    case 'resetDemo': if (await confirmSheet({ title: t('reset_demo'), body: esc(t('reset_demo_q')), ok: t('reset'), danger: true })) { DB = seed(); save(); S.uid = 'u1'; ss.set('lq_uid', 'u1'); S.draft = null; rerenderAll(); toast(t('reset_done')); } break;
    case 'editName': {
      const u = me();
      openSheet(`<h2 class="sh-title">${t('edit_name')}</h2><input class="text-in" id="nameIn" maxlength="24" value="${esc(u.display_name)}"><div class="sh-actions"><button class="btn ghost" data-act="closeSheet">${t('cancel')}</button><button class="btn primary" data-act="saveName">${t('save_changes')}</button></div>`);
      break;
    }
    case 'saveName': { const v2 = $('#nameIn').value.trim(); if (v2) { me().display_name = v2; save(); } closeSheet(); renderPage(); break; }
    // create
    case 'crClose': S.pick = null; location.hash = S.tab; break;
    case 'crStep': S.draft.step = +v; renderCreate(); break;
    case 'crNext': { const err = crValidate(S.draft.step); if (err) { toast(err); break; } S.draft.step++; renderCreate(); break; }
    case 'crPlace': { const p = PLACES.find(x => x.id === id); S.draft.loc = locFromLL(p); S.crSearch = ''; renderCreate(); break; }
    case 'crPickMap': S.pick = 'create'; S.mode === 'ask' || setMode('ask', true); location.hash = 'map'; break;
    case 'crUseLoc': locate(ll => { S.draft.loc = locFromLL(ll); if (S.createOpen) renderCreate(); }); break;
    case 'crCat': S.draft.cat = v; renderCreate(); break;
    case 'crReward': S.draft.reward = +v; S.draft.custom = ''; renderCreate(); break;
    case 'crExpiry': S.draft.expiryH = +v; renderCreate(); break;
    case 'crImgDel': S.draft.image = null; renderCreate(); break;
    case 'crPublish': {
      const d = S.draft;
      for (const s of [1, 2, 3]) { const err = crValidate(s); if (err) { d.step = s; renderCreate(); toast(err); return; } }
      try {
        const { q, notified } = API.createQuestion(d);
        S.draft = null; S.createOpen = false; if (S.mode !== 'ask') setMode('ask', true);
        toast(notified ? t('published_n', { n: notified }) : t('published'));
        goRoom(q.id);
      } catch (err) { toast(t('err_' + err.message)); }
      break;
    }
    // room
    case 'roomBack': if (S.room && S.room.thread && qById(S.room.qid).questioner_id === S.uid) { S.room.thread = null; S.composer = { text: '', image: null }; renderRoom(); } else { S.room = null; location.hash = S.tab; } break;
    case 'roomSeg': S.room.seg = v; renderRoomBody(); break;
    case 'openThread': S.room.thread = id; S.composer = { text: '', image: null }; renderRoom(); break;
    case 'join': try { API.join(S.room.qid); renderRoom(); setTimeout(() => $('#cmpText') && $('#cmpText').focus(), 40); } catch (err) { toast(t('err_' + err.message)); } break;
    case 'send': sendMsg(); break;
    case 'cmpImgDel': S.composer.image = null; renderComposerPreview(); break;
    case 'toggleOrig': S.showOrig = S.showOrig || {}; S.showOrig[id] = !S.showOrig[id]; renderRoomBody(); break;
    case 'retryTr': { const m = DB.messages.find(x => x.id === id); if (m) { if (S.trAvail === 'none') toast(t('tr_unavailable')); else queueMsgTranslation(m, lang(), true); renderRoomBody(); } break; }
    case 'retryQTr': { const q = qById(id); if (S.trAvail === 'none') { toast(t('tr_unavailable')); break; } ensureQTr(q, true); if (S.room) renderRoom(); else renderPreview(); break; }
    case 'selectAns': {
      const q = qById(S.room.qid), u = userById(id), fee = Math.round(q.reward_amount * FEE);
      if (await confirmSheet({ title: t('select_q', { name: u.display_name }), body: esc(t('select_body', { amt: won(q.reward_amount), pay: won(q.reward_amount - fee), fee: won(fee) })), ok: t('select_answer') })) {
        try { const pay = API.select(q.id, id); toast(t('selected_toast', { name: u.display_name, amt: won(pay) })); renderRoom(); } catch (err) { toast(t('err_' + err.message)); }
      }
      break;
    }
    case 'cancelQ': {
      const q = qById(S.room.qid);
      if (await confirmSheet({ title: t('cancel_question'), body: esc(t('cancel_body', { amt: won(q.reward_amount) })), ok: t('cancel_question'), danger: true })) { try { API.cancel(q.id); toast(t('refunded', { amt: won(q.reward_amount) })); renderRoom(); } catch (err) { toast(t('err_' + err.message)); } }
      break;
    }
  }
}
function goRoom(qid, thread) { S.preview = null; S.pendingThread = thread || null; if (location.hash === '#q-' + qid) route(); else location.hash = 'q-' + qid; }
function setMode(m, quiet) { S.mode = m; ss.set('lq_mode', m); S.preview = null; S.dropPin = null; if (!quiet) toast(t(m === 'ask' ? 'mode_ask_toast' : 'mode_answer_toast')); renderHeader(); if (S.tab === 'map') { renderMapChrome(); scheduleOverlay(); } else renderPage(); $('#app').classList.toggle('mode-ask', m === 'ask'); }
function sendMsg() {
  const ta = $('#cmpText'); if (!ta || !S.room) return;
  const q = qById(S.room.qid), text = ta.value;
  if (!text.trim() && !S.composer.image) return;
  try {
    API.send(q.id, S.room.thread, text, S.composer.image);
    S.composer = { text: '', image: null }; ta.value = ''; autoGrow(ta); renderComposerPreview(); renderRoomBody(true); ta.focus();
  } catch (err) { toast(t('err_' + err.message)); }
}

function bindEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    if (el.tagName === 'INPUT' && (el.type === 'checkbox' || el.type === 'file')) { if (el.type === 'checkbox') onAct(act, el, e); return; }
    if (el.tagName === 'SELECT') return;
    e.preventDefault(); onAct(act, el, e);
  });
  document.addEventListener('change', async e => {
    const el = e.target, act = el.dataset.act;
    if (act === 'langSelect' || el.id === 'langSel') { me().preferred_language = el.value; save(); rerenderAll(); return; }
    if (el.type === 'file' && el.files && el.files[0]) {
      try {
        if (act === 'avatarFile') { me().profile_image = await readImage(el.files[0], 200); save(); renderPage(); }
        if (act === 'crImg') { S.draft.image = await readImage(el.files[0], 720); renderCreate(); }
        if (act === 'cmpImg') { S.composer.image = await readImage(el.files[0], 720); renderComposerPreview(); }
      } catch (err) { toast(t('err_image')); }
      el.value = '';
    }
  });
  document.addEventListener('input', e => {
    const el = e.target, b = el.dataset.bind;
    if (el.id === 'searchInput') { S.search = el.value; S.searchOpen = true; renderSearchResults(); return; }
    if (el.id === 'cmpText') { S.composer.text = el.value; autoGrow(el); return; }
    if (!b) return;
    if (b === 'crSearch') { S.crSearch = el.value; $('#crResults').innerHTML = crResults(); return; }
    if (b === 'custom') { S.draft.custom = el.value; const n = parseInt(el.value, 10); if (n > 0) S.draft.reward = n; $$('.rw-opt').forEach(x => { x.classList.remove('on'); x.setAttribute('aria-pressed', 'false'); }); updateFee(); return; }
    S.draft[b] = el.value;
  });
  document.addEventListener('keydown', e => {
    if (e.target.id === 'cmpText' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); }
    if (e.key === 'Escape') { if (!$('#sheetRoot').hidden) closeSheet(false); else if (S.searchOpen) { S.searchOpen = false; renderSearchResults(); } else if (S.preview) { S.preview = null; renderMapChrome(); scheduleOverlay(); } }
  });
  $('#searchInput').addEventListener('focus', () => { S.searchOpen = true; renderSearchResults(); });
  $('#searchInput').addEventListener('blur', () => setTimeout(() => { if (!document.activeElement || !document.activeElement.closest('#searchWrap')) { S.searchOpen = false; renderSearchResults(); } }, 150));
  $('#searchResults').addEventListener('pointerdown', e => e.preventDefault());
  $('#searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') { const b = $('#searchResults .sr'); if (b) b.click(); } });
  window.addEventListener('hashchange', route);
  window.addEventListener('storage', e => {
    if (e.key !== KEY || !e.newValue) return;
    try { const d = JSON.parse(e.newValue); if (d && d.v === 1) { DB = d; refreshLive(); } } catch (_) {}
  });
  matchMedia('(min-width: 960px)').addEventListener('change', () => { if (S.tab === 'map') renderMapChrome(); });
}
function updateFee() { const d = S.draft, fee = Math.round(d.reward * FEE), f = $('.fee'); if (!f) return; const b = f.querySelectorAll('b'); b[0].textContent = won(d.reward - fee); b[1].textContent = won(fee); }
function refreshLive() {
  renderTabbar(); renderHeader();
  if (S.room) { if (!qById(S.room.qid)) { S.room = null; renderRoom(); } else renderRoomBody(); }
  if (S.tab === 'map') { renderPreview(); scheduleOverlay(); if (S.listOpen || isWide()) scheduleList(); }
  else if (!document.activeElement || !document.activeElement.matches('input,textarea,select')) renderPage();
}
function readImage(file, max) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('type'));
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.72)); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

// ===== boot =====
function boot() {
  load();
  API.sweep();
  $('#langSel').innerHTML = Object.entries(LANGS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  bindEvents(); mapInit();
  if (!location.hash) history.replaceState(null, '', '#map');
  route();
  getSample().then(s => { S.trAvail = s ? 'ready' : 'none'; if (S.room) renderComposerPreview(); });
  setInterval(() => { if (API.sweep()) refreshLive(); else if (!S.room && S.tab !== 'map' && !(document.activeElement && document.activeElement.matches('input,textarea'))) renderPage(); else if (S.tab === 'map') renderPreview(); }, 30000);
}
document.addEventListener('DOMContentLoaded', boot);
</script>
